<title>Fluxen Sales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
:root {
  --bg:#f1f5f9; --surface:#fff; --surface2:#f8fafc;
  --fg:#0f172a; --fg2:#334155; --muted:#64748b; --border:#e2e8f0;
  --accent:#E8630A; --accent-bg:#FFF3E8;
  --novo:#3b82f6; --neg:#f59e0b; --fechado:#10b981; --perdido:#94a3b8;
  --pa-bg:#dcfce7; --pa-fg:#166534;
  --pb-bg:#fef9c3; --pb-fg:#854d0e;
  --pc-bg:#fee2e2; --pc-fg:#991b1b;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --surface:#1e293b; --surface2:#172034;
    --fg:#f1f5f9; --fg2:#cbd5e1; --muted:#94a3b8; --border:#334155;
    --accent:#FB923C; --accent-bg:#3D1F0A;
    --pa-bg:#14532d; --pa-fg:#86efac;
    --pb-bg:#422006; --pb-fg:#fde68a;
    --pc-bg:#450a0a; --pc-fg:#fca5a5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --surface:#1e293b; --surface2:#172034;
  --fg:#f1f5f9; --fg2:#cbd5e1; --muted:#94a3b8; --border:#334155;
  --accent:#FB923C; --accent-bg:#3D1F0A;
  --pa-bg:#14532d; --pa-fg:#86efac;
  --pb-bg:#422006; --pb-fg:#fde68a;
  --pc-bg:#450a0a; --pc-fg:#fca5a5;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Inter',system-ui,sans-serif;font-size:14px;
  padding-left:max(0px,env(safe-area-inset-left,0px));
  padding-right:max(0px,env(safe-area-inset-right,0px));
}
.hdr{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:20px;
  padding:0 max(16px,env(safe-area-inset-left,0px));
}
.brand{font-weight:700;font-size:15px;padding:14px 0;white-space:nowrap}
.brand-logo{height:30px;padding:6px 0;object-fit:contain}
.brand span{color:var(--accent)}
.tabs{display:flex;gap:2px}
.tab{
  padding:10px 16px;font-size:13px;font-weight:500;color:var(--muted);
  cursor:pointer;background:none;border:none;
  border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;
}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-sm{padding:5px 10px;font-size:12px;font-weight:500;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:#10b981}
.dot.load{background:#f59e0b;animation:pulse 1s infinite}
.dot.err{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.main{padding:20px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kanban */
.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;min-height:calc(100vh - 60px)}
.kcol{flex:0 0 272px;display:flex;flex-direction:column;gap:8px}
.khead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border-radius:10px;border:1px solid var(--border)}
.kdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ktitle{font-weight:600;font-size:13px;flex:1}
.kcount{font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:20px}
.kbody{flex:1;display:flex;flex-direction:column;gap:8px;min-height:72px;padding:6px;border-radius:10px;border:2px dashed transparent;transition:border-color .15s,background .15s}
.kbody.over{border-color:var(--accent);background:var(--accent-bg)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:grab;transition:box-shadow .15s,transform .1s;display:flex;flex-direction:column;gap:7px;user-select:none}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.card.drag{opacity:.45;cursor:grabbing}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cname{font-weight:600;font-size:13px;line-height:1.3;flex:1;min-width:0}
.pb{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
.pA{background:var(--pa-bg);color:var(--pa-fg)}
.pB{background:var(--pb-bg);color:var(--pb-fg)}
.pC{background:var(--pc-bg);color:var(--pc-fg)}
.ctel{font-size:12px;color:var(--muted)}
.cobj{font-size:12px;color:var(--fg2);background:var(--surface2);padding:4px 8px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbot{display:flex;justify-content:space-between;align-items:center}
.cdate{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cval{font-size:11px;font-weight:600;color:var(--fechado)}
.ico{padding:4px 6px;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:5px;cursor:pointer;transition:all .1s}
.ico:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.empty-k{font-size:12px;color:var(--muted);text-align:center;padding:16px}

/* Tabela */
.twrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.si{flex:1;min-width:200px;max-width:300px;padding:7px 12px;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:7px;outline:none}
.si:focus{border-color:var(--accent)}
.tcnt{font-size:12px;color:var(--muted);margin-left:auto}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 14px;text-align:left;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;font-size:13px;color:var(--fg);border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.spill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.sn{background:#dbeafe;color:#1d4ed8}
.se{background:#fef3c7;color:#d97706}
.sf{background:#dcfce7;color:#15803d}
.sp{background:#f1f5f9;color:#64748b}

/* Agenda */
.agrid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:720px){.agrid{grid-template-columns:1fr}.kcol{flex:0 0 254px}}
.alist{display:flex;flex-direction:column;gap:12px}
.aday{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.adayh{padding:9px 14px;font-weight:600;font-size:11px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.05em}
.adayh.today{color:var(--accent)}
.trow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:none}
.trow.done{opacity:.45}
.tck{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-size:10px;color:transparent}
.tck.done{background:var(--fechado);border-color:var(--fechado);color:#fff}
.tinfo{flex:1;min-width:0}
.ttit{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlead{font-size:11px;color:var(--muted);margin-top:2px}
.thora{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ntcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px)}
.ntcard h3{font-weight:700;font-size:14px}
.fg-grp{display:flex;flex-direction:column;gap:5px}
.fl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fi,.fs{padding:8px 10px;font-size:13px;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:7px;outline:none;font-family:inherit}
.fi:focus,.fs:focus{border-color:var(--accent)}
.fs{cursor:pointer}
.btnp{padding:9px 16px;font-size:13px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:8px;cursor:pointer;transition:opacity .15s}
.btnp:hover{opacity:.88}
.btnp:disabled{opacity:.45;cursor:not-allowed}

/* Modal */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.moverlay[hidden]{display:none!important}
.modal{background:var(--surface);border-radius:14px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
.modal h2{font-weight:700;font-size:16px}
.modal p{font-size:13px;color:var(--muted)}
.mact{display:flex;gap:10px;justify-content:flex-end}
.btns{padding:9px 16px;font-size:13px;font-weight:500;color:var(--fg);background:var(--surface2);border:1px solid var(--border);border-radius:8px;cursor:pointer}

/* Toast */
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+18px);left:50%;transform:translateX(-50%);background:var(--fg);color:var(--surface);font-size:13px;font-weight:500;padding:9px 18px;border-radius:20px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@keyframes rot{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--muted);font-size:13px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite}
</style>

<div id="toast"></div>

<!-- Modal valor ao fechar -->
<div id="moverlay" class="moverlay" hidden onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2>Marcar como Fechado</h2>
    <p id="mlead"></p>
    <div class="fg-grp">
      <label class="fl">Valor do consórcio (R$)</label>
      <input id="mvalor" type="number" class="fi" placeholder="Deixe em branco se não souber" min="0" step="100">
    </div>
    <div class="mact">
      <button class="btns" onclick="closeModal()">Cancelar</button>
      <button class="btnp" onclick="confirmFechado()">✓ Confirmar</button>
    </div>
  </div>
</div>

<script>
const SB  = 'https://gflwotrnrhpkdpruvueu.supabase.co'
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmbHdvdHJucmhwa2RwcnV2dWV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxNzU0NjUsImV4cCI6MjEwOTc1MTQ2NX0.E44tLzbotB3DT9U2aaIWbOeHDeJqPGMqxHfmOYiulP0'
const EFN = SB + '/functions/v1/marcar-fechado'
const H   = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }

let leads = [], tarefas = [], tab = 'kanban', drag = null, pendLead = null

const ST = {
  novo:          { label: 'Novo lead',      color: '#3b82f6', sc: 'sn' },
  em_negociacao: { label: 'Em negociação',  color: '#f59e0b', sc: 'se' },
  fechado:       { label: 'Fechado',        color: '#10b981', sc: 'sf' },
  perdido:       { label: 'Perdido',        color: '#94a3b8', sc: 'sp' },
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

async function sbFetch(path, opts) {
  opts = opts || {}
  const r = await fetch(SB + '/rest/v1' + path, Object.assign({}, opts, { headers: Object.assign({}, H, opts.headers || {}) }))
  if (!r.ok) { const e = await r.json().catch(function(){ return {} }); throw new Error(e.message || r.statusText) }
  return r.status === 204 ? null : r.json()
}

async function load() {
  setDot('load')
  try {
    const res = await Promise.all([
      sbFetch('/leads?select=*&order=created_time.desc'),
      sbFetch('/tarefas?select=*&order=data_hora.asc')
    ])
    leads = res[0] || []
    tarefas = res[1] || []
    render()
    setDot('ok')
  } catch(err) {
    console.error(err)
    setDot('err')
    toast('Erro ao carregar dados')
  }
}

async function setStatus(id, st) {
  if (st === 'fechado') {
    var l = leads.find(function(x){ return x.lead_id === id })
    pendLead = id
    document.getElementById('mlead').textContent = (l && l.nome) ? l.nome : id
    document.getElementById('mvalor').value = ''
    document.getElementById('moverlay').hidden = false
    return
  }
  try {
    await sbFetch('/leads?lead_id=eq.' + id, {
      method: 'PATCH',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: st, status_updated_at: new Date().toISOString() })
    })
    var l2 = leads.find(function(x){ return x.lead_id === id })
    if (l2) l2.status = st
    render()
    toast('Status atualizado')
  } catch(err) {
    toast('Erro ao atualizar status')
    load()
  }
}

function closeModal() {
  document.getElementById('moverlay').hidden = true
  pendLead = null
  drag = null
  load()
}

async function confirmFechado() {
  var valor = parseFloat(document.getElementById('mvalor').value) || null
  var id = pendLead
  document.getElementById('moverlay').hidden = true
  pendLead = null
  drag = null

  try {
    var r = await fetch(EFN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY },
      body: JSON.stringify({ lead_id: id, valor: valor })
    })
    var d = await r.json().catch(function(){ return {} })
    if (r.ok) {
      toast(d.capi_configured ? '✓ Fechado — evento enviado ao Meta' : '✓ Fechado (configure CAPI token)')
    } else {
      await fallbackFechado(id, valor)
    }
  } catch(err) {
    await fallbackFechado(id, valor)
  }
  load()
}

async function fallbackFechado(id, valor) {
  try {
    await sbFetch('/leads?lead_id=eq.' + id, {
      method: 'PATCH',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ status: 'fechado', valor: valor, status_updated_at: new Date().toISOString() })
    })
    toast('Fechado (implante a Edge Function para ativar CAPI)')
  } catch(err) {
    toast('Erro ao fechar lead')
  }
}

function dstart(e, id) { drag = id; e.currentTarget.classList.add('drag'); e.dataTransfer.effectAllowed = 'move' }
function dend(e)        { e.currentTarget.classList.remove('drag'); drag = null }
function dover(e)       { e.preventDefault(); e.currentTarget.classList.add('over') }
function dleave(e)      { e.currentTarget.classList.remove('over') }
function ddrop(e, st)   { e.preventDefault(); e.currentTarget.classList.remove('over'); if (drag) setStatus(drag, st) }

function fmtDate(ts) {
  if (!ts) return ''
  return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })
}

function makeCard(l) {
  var lid = esc(l.lead_id)
  var dt  = fmtDate(l.created_time || l.inserted_at)
  var val = l.valor ? 'R$ ' + Number(l.valor).toLocaleString('pt-BR', { minimumFractionDigits: 0 }) : ''
  var tel = l.telefone ? '<div class="ctel">📞 ' + esc(l.telefone) + '</div>' : ''
  var obj = l.objetivo ? '<div class="cobj">' + esc(l.objetivo) + '</div>' : ''
  return '<div class="card" draggable="true" ' +
    'ondragstart="dstart(event,\'' + lid + '\')" ondragend="dend(event)">' +
    '<div class="ctop"><div class="cname">' + esc(l.nome || 'Sem nome') + '</div>' +
    '<div class="pb p' + esc(l.perfil || 'C') + '">' + esc(l.perfil || '?') + '</div></div>' +
    tel + obj +
    '<div class="cbot"><div class="cdate">' + dt +
    (val ? '<span class="cval">' + val + '</span>' : '') + '</div>' +
    '<button class="ico" onclick="agendarPara(\'' + lid + '\')">📅</button></div></div>'
}

function renderKanban() {
  var html = '<div class="kanban">'
  Object.keys(ST).forEach(function(k) {
    var cfg = ST[k]
    var col = leads.filter(function(l){ return l.status === k })
    html += '<div class="kcol">' +
      '<div class="khead"><div class="kdot" style="background:' + cfg.color + '"></div>' +
      '<div class="ktitle">' + cfg.label + '</div>' +
      '<div class="kcount">' + col.length + '</div></div>' +
      '<div class="kbody" ondragover="dover(event)" ondragleave="dleave(event)" ondrop="ddrop(event,\'' + k + '\')">' +
      (col.length ? col.map(makeCard).join('') : '<div class="empty-k">Nenhum lead</div>') +
      '</div></div>'
  })
  html += '</div>'
  document.getElementById('vk').innerHTML = html
}

function renderTabela() {
  var q = ''
  var sq = document.getElementById('sq')
  if (sq) q = sq.value.toLowerCase()
  var rows = leads.filter(function(l) {
    if (!q) return true
    return [l.nome, l.telefone, l.email].some(function(x){ return x && x.toLowerCase().indexOf(q) >= 0 })
  })
  var rowsHtml = rows.length ? rows.map(function(l) {
    var v = l.valor ? 'R$ ' + Number(l.valor).toLocaleString('pt-BR', { minimumFractionDigits: 0 }) : '-'
    var dt = l.created_time ? new Date(l.created_time).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '-'
    return '<tr>' +
      '<td><strong>' + esc(l.nome || '-') + '</strong></td>' +
      '<td>' + esc(l.telefone || '-') + '</td>' +
      '<td>' + esc(l.objetivo || '-') + '</td>' +
      '<td>' + esc(l.credito || '-') + '</td>' +
      '<td>' + esc(l.urgencia || '-') + '</td>' +
      '<td><span class="pb p' + esc(l.perfil || 'C') + '">' + esc(l.perfil || '?') + '</span></td>' +
      '<td><span class="spill ' + (ST[l.status] ? ST[l.status].sc : 'sn') + '">' + esc((ST[l.status] || {}).label || l.status) + '</span></td>' +
      '<td>' + v + '</td>' +
      '<td style="color:var(--muted);font-size:12px">' + dt + '</td></tr>'
  }).join('') : '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:30px">Nenhum lead</td></tr>'

  document.getElementById('vt').innerHTML =
    '<div class="twrap"><div class="tbar">' +
    '<input class="si" id="sq" placeholder="Buscar…" oninput="renderTabela()" value="' + esc(q) + '">' +
    '<span class="tcnt">' + rows.length + ' leads</span></div>' +
    '<div class="tscroll"><table><thead><tr>' +
    '<th>Nome</th><th>Telefone</th><th>Objetivo</th><th>Crédito</th>' +
    '<th>Urgência</th><th>Perfil</th><th>Status</th><th>Valor</th><th>Data</th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div></div>'
}

function renderAgenda() {
  var today = new Date(); today.setHours(0,0,0,0)
  var groups = {}
  tarefas.forEach(function(t) {
    var d = new Date(t.data_hora); d.setHours(0,0,0,0)
    var k = d.toISOString().slice(0,10)
    if (!groups[k]) groups[k] = []
    groups[k].push(t)
  })
  var days = Object.keys(groups).sort()
  var listHtml = days.length ? days.map(function(dk) {
    var d = new Date(dk + 'T12:00:00')
    var isToday = d.getTime() === today.getTime()
    var lbl = isToday ? 'Hoje' : d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })
    var rows = groups[dk].map(function(t) {
      var lead = leads.find(function(x){ return x.lead_id === t.lead_id })
      var hora = new Date(t.data_hora).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
      return '<div class="trow' + (t.concluida ? ' done' : '') + '">' +
        '<div class="tck' + (t.concluida ? ' done' : '') + '" onclick="toggleT(\'' + esc(t.id) + '\',' + !t.concluida + ')">' + (t.concluida ? '✓' : '') + '</div>' +
        '<div class="tinfo"><div class="ttit">' + esc(t.titulo) + '</div>' +
        '<div class="tlead">' + esc((lead && lead.nome) || t.lead_id) + '</div></div>' +
        '<div class="thora">' + hora + '</div></div>'
    }).join('')
    return '<div class="aday"><div class="adayh' + (isToday ? ' today' : '') + '">' + lbl + '</div>' + rows + '</div>'
  }).join('') : '<p style="color:var(--muted);font-size:13px">Nenhuma tarefa agendada.</p>'

  var opts = leads.map(function(l) {
    return '<option value="' + esc(l.lead_id) + '">' + esc(l.nome || l.lead_id) + '</option>'
  }).join('')

  document.getElementById('va').innerHTML =
    '<div class="agrid"><div class="alist">' + listHtml + '</div>' +
    '<div class="ntcard"><h3>Nova tarefa</h3>' +
    '<div class="fg-grp"><label class="fl">Lead</label>' +
    '<select class="fs" id="tl"><option value="">Selecione…</option>' + opts + '</select></div>' +
    '<div class="fg-grp"><label class="fl">Título</label>' +
    '<input type="text" class="fi" id="tt" placeholder="Ex: Ligar para confirmar proposta"></div>' +
    '<div class="fg-grp"><label class="fl">Data e hora</label>' +
    '<input type="datetime-local" class="fi" id="td"></div>' +
    '<button class="btnp" onclick="submitT()">Agendar</button></div></div>'
}

async function toggleT(id, done) {
  try {
    await sbFetch('/tarefas?id=eq.' + id, {
      method: 'PATCH',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ concluida: done })
    })
    var t = tarefas.find(function(x){ return x.id === id })
    if (t) t.concluida = done
    renderAgenda()
  } catch(err) { toast('Erro ao atualizar tarefa') }
}

async function submitT() {
  var lid = (document.getElementById('tl') || {}).value
  var tit = ((document.getElementById('tt') || {}).value || '').trim()
  var dat = (document.getElementById('td') || {}).value
  if (!lid || !tit || !dat) { toast('Preencha todos os campos'); return }
  try {
    await sbFetch('/tarefas', {
      method: 'POST',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ lead_id: lid, titulo: tit, data_hora: new Date(dat).toISOString() })
    })
    toast('✓ Tarefa agendada')
    load()
  } catch(err) { toast('Erro ao agendar tarefa') }
}

function agendarPara(id) {
  go('agenda')
  setTimeout(function() {
    var s = document.getElementById('tl')
    if (s) s.value = id
  }, 100)
}

function render() {
  if (tab === 'kanban') renderKanban()
  else if (tab === 'tabela') renderTabela()
  else renderAgenda()
}

function go(t) {
  tab = t
  var tabs = document.querySelectorAll('.tab')
  var keys = ['kanban', 'tabela', 'agenda']
  tabs.forEach(function(b, i) { b.classList.toggle('on', keys[i] === t) })
  ;['vk','vt','va'].forEach(function(id, i) { document.getElementById(id).hidden = keys[i] !== t })
  render()
}

function setDot(s) { document.getElementById('sdot').className = 'dot ' + s }

function toast(msg) {
  var el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('on')
  setTimeout(function(){ el.classList.remove('on') }, 2600)
}

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal() })
document.getElementById('moverlay').addEventListener('click', function(e){ if (e.target === this) closeModal() })

load()
</script>
